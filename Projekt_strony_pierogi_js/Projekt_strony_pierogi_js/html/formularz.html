<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pierogarnia - Zamówienie (Projekt Semantyczny)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/formularz.css" />
  </head>
  <body>
    <img src="/public/tło.jpg" alt="Tło Pierogarni" id="back-ground" />

    <form class="container order-container">
      <img
        src="/public/logo.jpg"
        alt="Logo Pierogarni"
        class="responsive-logo"
      />

      <header>
        <h1 class="responsive-h1">Podsumowanie zamówienia</h1>
      </header>

      <main>
        <section>
          <h2 class="section-title">Twoje zamówienie</h2>
          <div id="ordered-items-list" class="inputs-group"></div>

          <div class="summary-total">
            Razem do zapłaty: <span id="total-price-display">0.00</span> zł
          </div>
        </section>

        <section>
          <h2 class="section-title">1. Dane kontaktowe</h2>
          <fieldset class="inputs-group">
            <input
              type="text"
              name="name"
              id="name"
              placeholder="Imię i nazwisko"
              class="responsive-input"
              required
            />
            <div class="row-inputs">
              <input
                type="tel"
                name="phone"
                id="phone"
                placeholder="Numer telefonu"
                class="responsive-input inline-input"
                required
              />
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Pobieranie adresu Email..."
                class="responsive-input inline-input locked-input"
                readonly
                required
              />
            </div>
          </fieldset>
        </section>

        <section>
          <fieldset class="options-fieldset">
            <legend class="section-title">2. Opcja dostawy</legend>
            <label class="radio-label">
              <input
                type="radio"
                name="delivery"
                value="delivery"
                checked
                class="responsive-radio"
              />
              Dostawa kurierem do domu
            </label>
            <label class="radio-label">
              <input
                type="radio"
                name="delivery"
                value="pickup"
                class="responsive-radio"
              />
              Odbiór osobisty (Przyjadę sam - 0 zł)
            </label>
          </fieldset>
        </section>

        <section>
          <h2 class="section-title">3. Adres dostawy</h2>
          <fieldset class="inputs-group">
            <input
              type="text"
              name="street"
              id="street"
              placeholder="Ulica i numer domu/mieszkania"
              class="responsive-input"
              required
            />
            <div class="row-inputs">
              <input
                type="text"
                name="zip"
                id="zip"
                placeholder="Kod pocztowy"
                class="responsive-input inline-input"
                required
              />

              <input
                type="text"
                name="city"
                id="city"
                list="cities-list"
                placeholder="Miasto"
                class="responsive-input inline-input"
                required
              />

              <datalist id="cities-list">
                <option value="Lublin"></option>
                <option value="Zamość"></option>
                <option value="Chełm"></option>
                <option value="Biała Podlaska"></option>
                <option value="Puławy"></option>
                <option value="Świdnik"></option>
                <option value="Kraśnik"></option>
              </datalist>
            </div>
          </fieldset>
        </section>

        <section>
          <fieldset class="options-fieldset">
            <legend class="section-title">4. Płatność</legend>
            <label class="radio-label">
              <input
                type="radio"
                name="payment"
                value="blik"
                checked
                class="responsive-radio"
              />
              BLIK / Szybki przelew
            </label>
            <label class="radio-label">
              <input
                type="radio"
                name="payment"
                value="card"
                class="responsive-radio"
              />
              Karta przy odbiorze
            </label>
            <label class="radio-label">
              <input
                type="radio"
                name="payment"
                value="cash"
                class="responsive-radio"
              />
              Gotówka przy odbiorze
            </label>
          </fieldset>
        </section>

        <section>
          <h2 class="section-title">5. Napiwek dla kierowcy</h2>
          <fieldset class="inputs-group">
            <select name="tip" id="tip" class="responsive-input select-tip">
              <option value="0">Bez napiwku</option>
              <option value="2">2.00 zł</option>
              <option value="5">5.00 zł (Polecane)</option>
              <option value="10">10.00 zł</option>
            </select>
          </fieldset>
        </section>

        <section>
          <h2 class="section-title">6. Dodatkowe komentarze do zamówienia</h2>
          <fieldset class="inputs-group">
            <textarea
              name="notes"
              id="notes"
              placeholder="np. Bez cebulki, klatka B, domofon 24, zostaw pod drzwiami..."
              class="responsive-textarea"
            ></textarea>
          </fieldset>
        </section>
      </main>

      <footer>
        <button type="submit" class="responsive-btn btn-dark">
          Zamawiam i płacę
        </button>
        <a href="home.html" class="responsive-link">
          <button type="button" class="responsive-btn btn-light">
            Wróć do menu
          </button>
        </a>
      </footer>
    </form>

    <script type="module" src="/js/formularz.js"></script>
  </body>
</html>
