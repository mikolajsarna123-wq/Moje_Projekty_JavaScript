<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&display=swap"
      rel="stylesheet"
    />

    <title>Pierogarnia</title>
  </head>
  <body>
    <img src="/public/tło.jpg" alt="jpg" id="back-ground" />
    <form action="./RegisterPanel.html" class="container-register">
      <img src="/public/logo1.jpg" alt="jpg" />
      <header>
        <h1>Rejestracja</h1>
      </header>
      <main>
        <div class="inputs">
          <input
            pattern="^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłnóśźż]*$"
            title="nazwa ma sie zaczynac z dużej litery"
            type="text"
            name="login"
            id="login"
            placeholder="Nazwa użytkownika"
            required
          />
          <input type="email" name="email" id="email" placeholder="Email" />
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Hasło"
            required
          />
          <input
            type="password"
            name="password_repeat"
            id="password_repeat"
            placeholder="Powtórz hasło"
            required
          />
        </div>
        <div class="buttons">
          <button type="submit">Potwierdz</button>
          <a href="login.html"><button type="button">Logownie</button></a>
        </div>
      </main>
      <footer>
        <label>
          <input type="checkbox" id="showAllPasswords" /> Pokaż oba hasła
        </label>
      </footer>
    </form>
    <script src="/js/register.js"></script>
  </body>
</html>
